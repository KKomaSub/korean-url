<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0e5"><meta name="description" content="주소를 한글 문장으로 엮는 글길"><link rel="icon" type="image/webp" href="/icon.webp"><link rel="apple-touch-icon" href="/icon-192.webp"><title>글길 — 주소를 문장으로</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap');
:root{color-scheme:light;--paper:#f5f0e5;--ink:#24261f;--red:#994d40;--line:#d8cabc}*{box-sizing:border-box}html{min-height:100%;background:#ede7db}body{margin:0;color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;background:radial-gradient(ellipse at 30% 10%,#fffdf4 0,transparent 65%),repeating-linear-gradient(9deg,#8a63340a 0 1px,transparent 1px 5px),var(--paper)}header{height:86px;border-bottom:1px solid #cabdad;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,6vw,108px)}.logo{display:flex;align-items:center;gap:11px;font:700 28px 'Noto Serif KR',serif;letter-spacing:-.06em}.logo img{width:46px;height:46px;object-fit:cover;border-radius:12px;border:1px solid #d4c4b2}header span{font:12px 'Noto Serif KR',serif;letter-spacing:.2em;color:#826e5b}main{width:min(850px,calc(100% - 40px));margin:clamp(60px,10vh,130px) auto 100px}h1{font:600 clamp(35px,6.2vw,66px)/1.45 'Noto Serif KR',serif;letter-spacing:-.075em;margin:0}.accent{color:var(--red)}.sub{font:15px 'Noto Serif KR',serif;color:#71675b;margin:22px 0 60px}.sheet{background:#fffcf4cc;border:1px solid #d0beab;box-shadow:0 19px 65px #6c4a2310,0 2px 6px #7c5f2908;padding:clamp(23px,4vw,44px);position:relative}.sheet:before{content:'';position:absolute;inset:11px;border:1px solid #ae62501f;pointer-events:none}.sheet>*{position:relative}.heading{display:flex;align-items:center;gap:12px;font:600 15px 'Noto Serif KR',serif;margin-bottom:22px}.heading:before{content:'文';width:31px;height:31px;border:1px solid var(--red);color:var(--red);display:grid;place-items:center;font:18px serif}form{display:flex;gap:10px}input{flex:1;min-width:0;padding:18px 17px;font:15px 'Noto Sans KR',sans-serif;border:1px solid #cdbdab;background:#fffef9;color:var(--ink);outline:none;border-radius:0}input:focus{border-color:var(--red)}button{border:0;border-radius:0;background:var(--red);color:white;padding:0 26px;font:500 14px 'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap}button:hover{background:#7d3e34}button:disabled{opacity:.6;cursor:wait}.result{display:none;border-top:1px solid #ddd0bf;margin-top:31px;padding-top:24px}.result.show{display:block}.result small{font:12px 'Noto Serif KR',serif;color:#806b5a;display:block;margin-bottom:13px}.manuscript{background-color:#fffdf8;background-image:linear-gradient(#bd807349 1px,transparent 1px),linear-gradient(90deg,#bd807349 1px,transparent 1px);background-size:32px 32px;border:1px solid #c9a79e;padding:16px;min-height:85px;line-height:32px;word-break:break-all;font:16px/32px 'Noto Serif KR',serif;color:#463b32;overflow-wrap:anywhere}.result-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:18px}.result-footer a{color:var(--red);font-size:13px;text-decoration:none}.result-footer button{padding:12px 22px}.error{min-height:22px;margin:15px 0 0;color:#a03d2d;font-size:13px}.foot{margin:32px 0 0;text-align:center;font:12px 'Noto Serif KR',serif;color:#877768;letter-spacing:.06em}@media(max-width:530px){header{height:69px}main{margin-top:70px}.sub{margin-bottom:43px}form{flex-direction:column}button{padding:16px}.result-footer{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="logo"><img src="/icon.webp" width="46" height="46" alt="">글길</div><span>한글로 잇는 주소</span></header><main><h1>긴 주소를,<br><span class="accent">한 편의 문장으로.</span></h1><p class="sub">낯선 주소에 우리말의 결을 입힙니다.</p><section class="sheet"><div class="heading">주소를 적어주세요</div><form id="form"><input id="url" aria-label="원본 URL" type="text" inputmode="url" spellcheck="false" required placeholder="https://한글날.한국/우리말 또는 example.com" autocomplete="url"><button id="submit" type="submit">글길 만들기 →</button></form><p id="error" class="error" aria-live="polite"></p><div class="result" id="result"><small>완성된 글길</small><div id="manuscript" class="manuscript"></div><div class="result-footer"><a id="link" target="_blank" rel="noopener noreferrer">글길 열기 ↗</a><button type="button" id="copy">주소 복사</button></div></div></section><p class="foot">한 글자 한 글자, 길이 되다.</p></main><script>
const form=document.querySelector('#form'),input=document.querySelector('#url'),error=document.querySelector('#error'),result=document.querySelector('#result'),manuscript=document.querySelector('#manuscript'),link=document.querySelector('#link'),submit=document.querySelector('#submit'),copy=document.querySelector('#copy');let lastUrl='';
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';result.classList.remove('show');submit.disabled=true;submit.textContent='엮는 중…';try{const response=await fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:input.value.trim()})});const data=await response.json();if(!response.ok)throw Error(data.error||'주소를 변환하지 못했습니다.');lastUrl=data.url;manuscript.textContent=data.path;link.href=lastUrl;result.classList.add('show');}catch(err){error.textContent=err.message||'잠시 후 다시 시도해 주세요.';}finally{submit.disabled=false;submit.textContent='글길 만들기 →';}});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(lastUrl);copy.textContent='복사했습니다 ✓';setTimeout(()=>copy.textContent='주소 복사',1600);}catch{error.textContent='주소를 복사할 수 없습니다.';}});
</script></body></html>
