<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0e5"><meta name="description" content="주소를 한글 문장으로 엮는 글길"><link rel="icon" type="image/webp" href="/icon.webp"><link rel="apple-touch-icon" href="/icon-192.webp"><title>글길 — 주소를 문장으로</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap');
:root{color-scheme:light;--paper:#f5f0e5;--ink:#24261f;--red:#994d40;--line:#d8cabc}*{box-sizing:border-box}html{min-height:100%;background:#ede7db}body{margin:0;color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;background:radial-gradient(ellipse at 30% 10%,#fffdf4 0,transparent 65%),repeating-linear-gradient(9deg,#8a63340a 0 1px,transparent 1px 5px),var(--paper)}header{height:86px;border-bottom:1px solid #cabdad;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,6vw,108px)}.logo{display:flex;align-items:center;gap:11px;font:700 28px 'Noto Serif KR',serif;letter-spacing:-.06em}.logo img{width:46px;height:46px;object-fit:cover;border-radius:12px;border:1px solid #d4c4b2}header span{font:12px 'Noto Serif KR',serif;letter-spacing:.2em;color:#826e5b}main{width:min(850px,calc(100% - 40px));margin:clamp(60px,10vh,130px) auto 100px}h1{font:600 clamp(35px,6.2vw,66px)/1.45 'Noto Serif KR',serif;letter-spacing:-.075em;margin:0}.accent{color:var(--red)}.sub{font:15px 'Noto Serif KR',serif;color:#71675b;margin:22px 0 60px}.sheet{background:#fffcf4cc;border:1px solid #d0beab;box-shadow:0 19px 65px #6c4a2310,0 2px 6px #7c5f2908;padding:clamp(23px,4vw,44px);position:relative}.sheet:before{content:'';position:absolute;inset:11px;border:1px solid #ae62501f;pointer-events:none}.sheet>*{position:relative}.heading{display:flex;align-items:center;gap:12px;font:600 15px 'Noto Serif KR',serif;margin-bottom:22px}.heading:before{content:'文';width:31px;height:31px;border:1px solid var(--red);color:var(--red);display:grid;place-items:center;font:18px serif}form{display:flex;gap:10px}input{flex:1;min-width:0;padding:18px 17px;font:15px 'Noto Sans KR',sans-serif;border:1px solid #cdbdab;background:#fffef9;color:var(--ink);outline:none;border-radius:0}input:focus{border-color:var(--red)}button{border:0;border-radius:0;background:var(--red);color:white;padding:0 26px;font:500 14px 'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap}button:hover{background:#7d3e34}button:disabled{opacity:.6;cursor:wait}.result{display:none;border-top:1px solid #ddd0bf;margin-top:31px;padding-top:24px}.result.show{display:block}.result small{font:12px 'Noto Serif KR',serif;color:#806b5a;display:block;margin-bottom:13px}.manuscript{background-color:#fffdf8;background-image:linear-gradient(#bd807349 1px,transparent 1px),linear-gradient(90deg,#bd807349 1px,transparent 1px);background-size:32px 32px;border:1px solid #c9a79e;padding:16px;min-height:85px;line-height:32px;word-break:break-all;font:16px/32px 'Noto Serif KR',serif;color:#463b32;overflow-wrap:anywhere}.result-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:18px}.result-footer a{color:var(--red);font-size:13px;text-decoration:none}.result-footer button{padding:12px 22px}.error{min-height:22px;margin:15px 0 0;color:#a03d2d;font-size:13px}.foot{margin:32px 0 0;text-align:center;font:12px 'Noto Serif KR',serif;color:#877768;letter-spacing:.06em}@media(max-width:530px){header{height:69px}main{margin-top:70px}.sub{margin-bottom:43px}form{flex-direction:column}button{padding:16px}.result-footer{align-items:flex-start;flex-direction:column}}

.meaning-panel{display:none;margin-top:22px;border-top:1px solid #d8cabc;padding-top:24px}.meaning-panel.show{display:block}.meaning-head{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}.meaning-label{font:600 15px 'Noto Serif KR',serif}.meaning-origin{font:12px 'Noto Serif KR',serif;color:#806b5a}.meaning-copy{font:14px/2 'Noto Sans KR',sans-serif;margin:0;color:#413b34;word-break:keep-all}.meaning-note{font:12px/1.7 'Noto Serif KR',serif;color:#887a68;margin:10px 0 0}.word-popup{display:none;position:fixed;z-index:20;max-width:min(350px,calc(100vw - 28px));min-width:180px;padding:13px 16px;background:#fffdf5;border:1px solid #bcae9a;box-shadow:0 8px 25px #33241727;color:#28251e}.word-popup.show{display:block}.word-popup button{padding:9px 12px;margin-top:9px}.word-popup strong{font:600 16px 'Noto Serif KR',serif}.word-popup p{font:13px/1.75 'Noto Sans KR',sans-serif;margin:7px 0 0;word-break:keep-all}.word-popup small{display:block;font:11px 'Noto Serif KR',serif;color:#887a68;margin-top:6px}.manuscript{cursor:text}.word-hint{font:12px/1.6 'Noto Serif KR',serif;color:#7b6e5e;margin:16px 0 0}.ai-controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:17px}.ai-controls button{padding:10px 16px}.ai-controls button:disabled{cursor:not-allowed;opacity:.45}.ai-quota{font:12px 'Noto Sans KR',sans-serif;color:#766b5d}
</style></head><body><header><div class="logo"><img src="/icon.webp" width="46" height="46" alt="">글길</div><span>한글로 잇는 주소</span></header><main><h1>긴 주소를,<br><span class="accent">한 편의 문장으로.</span></h1><p class="sub">낯선 주소를 익숙한 우리말로 만들어 줍니다.</p><section class="sheet"><div class="heading">주소를 적어주세요</div><form id="form"><input id="url" aria-label="원본 URL" type="text" inputmode="url" spellcheck="false" required placeholder="https://한글날.한국/우리말 또는 example.com" autocomplete="url"><button id="submit" type="submit">글길 만들기 →</button></form><p id="error" class="error" aria-live="polite"></p><div class="result" id="result"><small>완성된 글길</small><div id="manuscript" class="manuscript"></div><div class="result-footer"><a id="link" target="_blank" rel="noopener noreferrer">글길 열기 ↗</a><button type="button" id="copy">주소 복사</button></div><div id="meaning-panel" class="meaning-panel" aria-live="polite"><div class="meaning-head"><span class="meaning-label">이 글길에 담긴 뜻</span><span id="meaning-origin" class="meaning-origin"></span></div><p id="meaning-copy" class="meaning-copy"></p><p id="meaning-note" class="meaning-note"></p><p class="word-hint">문장에서 단어를 드래그하여 선택하면 뜻을 찾아볼 수 있습니다.</p><div class="ai-controls"><button id="ai-meaning" type="button" disabled>AI 뜻풀이</button><span id="ai-quota" class="ai-quota"></span></div></div></div></section><p class="foot">한 글자 한 글자, 길이 되다.</p></main><div id="word-popup" class="word-popup" role="status" aria-live="polite"><strong id="word-title"></strong><p id="word-content">드래그한 낱말의 뜻을 찾아보세요.</p><small id="word-source"></small><button type="button" id="word-action">뜻 찾기</button></div><script>
const form=document.querySelector('#form'),input=document.querySelector('#url'),error=document.querySelector('#error'),result=document.querySelector('#result'),manuscript=document.querySelector('#manuscript'),link=document.querySelector('#link'),submit=document.querySelector('#submit'),copy=document.querySelector('#copy');
const meaningPanel=document.querySelector('#meaning-panel'),meaningCopy=document.querySelector('#meaning-copy'),meaningOrigin=document.querySelector('#meaning-origin'),meaningNote=document.querySelector('#meaning-note'),aiButton=document.querySelector('#ai-meaning'),aiQuota=document.querySelector('#ai-quota');
const wordPopup=document.querySelector('#word-popup'),wordTitle=document.querySelector('#word-title'),wordContent=document.querySelector('#word-content'),wordSource=document.querySelector('#word-source'),wordAction=document.querySelector('#word-action');
let lastUrl='',lastPath='',serial=0,selectedWord='',deviceHashPromise;
// First-party pseudonymous fingerprint: a browser-local random installation ID combined
// with coarse browser attributes. Only its SHA-256 digest crosses the network.
async function deviceFingerprint(){
 if(!deviceHashPromise)deviceHashPromise=(async()=>{
  let browserId;
  try{browserId=localStorage.getItem('geulgil_device_v1');if(!/^[0-9a-f-]{36}$/.test(browserId||'')){browserId=crypto.randomUUID();localStorage.setItem('geulgil_device_v1',browserId);}}
  catch{browserId=crypto.randomUUID();}
  const coarse=[browserId,navigator.userAgent,navigator.language,Intl.DateTimeFormat().resolvedOptions().timeZone,screen.width,screen.height,navigator.hardwareConcurrency||0].join('|');
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(coarse));
  return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
 })();return deviceHashPromise;
}
const apiReason={no_database:'D1 데이터베이스가 연결되지 않았습니다.',database_schema_error:'D1에 기기별 사용량 마이그레이션이 필요합니다.',device_unavailable:'기기 식별 환경변수나 브라우저 식별값을 확인해 주세요.',daily_limit:'오늘 이 브라우저의 AI 뜻풀이 횟수를 모두 사용했습니다.',no_keys:'Gemini API 키가 설정되지 않았습니다.',keys_not_configured:'Gemini API 키가 설정되지 않았습니다.',model_unavailable:'선택한 Gemini 모델에 접근할 수 없습니다. GEMINI_MODEL을 확인해 주세요.',rate_limited:'설정한 API 키의 Gemini 요청 한도가 초과되었습니다.',key_rejected:'Gemini API 키 권한과 사용 설정을 확인해 주세요.',invalid_response:'Gemini가 올바른 풀이를 반환하지 않았습니다.',output_limit:'Gemini 응답이 길이 제한에 도달했습니다. 다시 시도해 주세요.',invalid_request:'Gemini 요청 형식 또는 모델 설정을 확인해 주세요.',network_error:'Gemini 서버로 연결할 수 없습니다. Cloudflare 네트워크 상태를 확인해 주세요.',ai_url_too_long:'주소가 길어 AI 뜻풀이를 사용할 수 없습니다. 규칙 기반 풀이만 제공합니다.',timeout:'Gemini 응답이 지연되어 규칙 기반 풀이를 유지합니다.',all_keys_failed:'설정한 Gemini API 키로 호출하지 못했습니다. 모델 및 할당량을 확인해 주세요.',temporary_error:'일시적인 오류로 규칙 기반 풀이를 유지합니다.',being_generated:'동일한 문장의 뜻풀이를 생성하는 중입니다.'};
function setQuota(d){
 const q=d?.quota;aiButton.disabled=!d?.aiAvailable;
 if(d?.reason==='ai_url_too_long'){
  aiQuota.textContent=apiReason.ai_url_too_long;
  aiButton.title='긴 주소는 AI 풀이를 지원하지 않습니다.';
 }else{
  aiButton.title='';
  aiQuota.textContent=q?`오늘 AI 뜻풀이 ${q.remaining}/${q.limit}회 남음`:(apiReason[d?.reason]||'');
  if(q&&q.remaining===0)aiQuota.textContent='오늘 AI 뜻풀이 횟수를 모두 사용했습니다.';
 }
}
async function meaningRequest(path,mode){
 return fetch('/api/meaning',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path,mode,fingerprint:await deviceFingerprint()})})
   .then(async r=>{const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'풀이를 불러오지 못했습니다.');return d;});
}
form.addEventListener('submit',async e=>{
 e.preventDefault();const session=++serial;error.textContent='';result.classList.remove('show');meaningPanel.classList.remove('show');wordPopup.classList.remove('show');submit.disabled=true;submit.textContent='엮는 중…';
 try{
  const response=await fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:input.value.trim()})});
  const data=await response.json();if(!response.ok)throw Error(data.error||'주소를 변환하지 못했습니다.');
  if(session!==serial)return;
  lastPath=data.path;lastUrl=data.url;manuscript.textContent=data.path;link.href=lastUrl;result.classList.add('show');
  meaningPanel.classList.add('show');meaningCopy.textContent='문장의 뜻을 살펴보고 있습니다…';meaningOrigin.textContent='규칙 기반 뜻풀이';meaningNote.textContent='AI를 사용하지 않은 규칙 기반 뜻풀이입니다.';
  aiButton.disabled=true;aiQuota.textContent='남은 횟수 확인 중…';
  try{const d=await meaningRequest(data.path,'local');if(session!==serial)return;
   meaningCopy.textContent=d.meaning;setQuota(d);
   if(d.reason==='ai_url_too_long')meaningNote.textContent='AI를 사용하지 않은 규칙 기반 뜻풀이입니다. 긴 URL은 AI 뜻풀이를 지원하지 않습니다.';
  }catch{if(session===serial){meaningCopy.textContent='규칙 기반 풀이를 불러올 수 없습니다.';aiButton.disabled=true;aiQuota.textContent='서버 연결을 확인해 주세요.';}}
 }catch(err){if(session===serial)error.textContent=err.message||'잠시 후 다시 시도해 주세요.';}
 finally{if(session===serial){submit.disabled=false;submit.textContent='글길 만들기 →';}}
});
aiButton.addEventListener('click',async()=>{
 if(!lastPath||aiButton.disabled)return;
 const session=serial,path=lastPath;aiButton.disabled=true;aiButton.textContent='AI 뜻풀이 생성 중…';
 try{const d=await meaningRequest(path,'ai');if(session!==serial)return;
  setQuota(d);
  if(d.source==='gemini'){
   meaningCopy.textContent=d.meaning;meaningOrigin.textContent=d.cached?'저장된 AI 뜻풀이':'Gemini AI 뜻풀이';
   meaningNote.textContent='변환한 한글 문장에 대한 문학적 해석입니다. 원본 URL은 Gemini로 보내지 않습니다.';
  }else{meaningNote.textContent='AI를 사용하지 않은 규칙 기반 뜻풀이입니다. '+(apiReason[d.reason]||'잠시 후 다시 시도해 주세요.');}
 }catch{if(session===serial){meaningNote.textContent='AI 연결에 실패했습니다. 규칙 기반 뜻풀이가 유지됩니다.';aiButton.disabled=false;}}
 finally{if(session===serial)aiButton.textContent='AI 뜻풀이';}
});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(lastUrl);copy.textContent='복사했습니다 ✓';setTimeout(()=>copy.textContent='주소 복사',1600);}catch{error.textContent='주소를 복사할 수 없습니다.';}});
function selectedInManuscript(){
 const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return null;
 const range=selection.getRangeAt(0);if(!manuscript.contains(range.commonAncestorContainer))return null;
 const word=selection.toString().trim();if(!word||word.length>24||!/^[가-힣a-zA-Z\s]+$/.test(word))return null;
 return {word,rect:range.getBoundingClientRect()};
}
function showSelection(){
 const selected=selectedInManuscript();if(!selected)return;
 selectedWord=selected.word;wordTitle.textContent='‘'+selectedWord+'’';wordContent.textContent='선택한 부분의 뜻을 찾아보세요.';wordSource.textContent='';wordAction.hidden=false;wordAction.textContent='뜻 찾기';
 wordPopup.classList.add('show');const left=Math.max(12,Math.min(selected.rect.left,innerWidth-365));
 wordPopup.style.left=left+'px';wordPopup.style.top=Math.min(Math.max(8,selected.rect.bottom+8),innerHeight-175)+'px';
}
manuscript.addEventListener('mouseup',()=>setTimeout(showSelection,0));
manuscript.addEventListener('touchend',()=>setTimeout(showSelection,120));
wordAction.addEventListener('click',async()=>{
 const term=selectedWord;wordAction.disabled=true;wordContent.textContent='뜻을 찾는 중…';
 try{const r=await fetch('/api/dictionary?q='+encodeURIComponent(term));const d=await r.json();
  if(term!==selectedWord)return;
  wordContent.textContent=d.ok?d.meaning:'등록된 사전 풀이를 찾지 못했습니다. 다른 낱말을 선택해 주세요.';
  wordSource.textContent=d.ok?({naver:'네이버 사전',stdict:'표준국어대사전',context:'문맥 기반 풀이'}[d.source]||'뜻 풀이'):'';
  wordAction.hidden=true;
 }catch{wordContent.textContent='현재 사전에 연결할 수 없습니다.';}
 finally{wordAction.disabled=false;}
});
document.addEventListener('pointerdown',e=>{if(!wordPopup.contains(e.target)&&!manuscript.contains(e.target))wordPopup.classList.remove('show');});
</script></body></html>
